<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Logo — Nycolas Garcia</title>
  <!-- Fonte JetBrains Mono de volta -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      color: white;
    }
    .logo {
      font-size: 2.5em;
      font-weight: 800;
      white-space: nowrap;
    }
    .chev { color: rgb(140,70,140); }
    .init { color: rgb(50,150,90); }
  </style>
</head>
<body>
  <div class="logo">
    <span class="chev">&lt;</span><span class="init">N</span>ycolas<br>
    <span class="chev">/</span><span class="init">G</span>arcia<span class="chev">&gt;</span>
  </div>
</body>
</html>
